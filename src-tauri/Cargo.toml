[package]
name = "project-entity"
version = "0.1.0"
description = "Project Entity desktop card game"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
